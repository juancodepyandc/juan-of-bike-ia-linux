name: Mission contracts
on:
  push:
    branches: [main]
    paths:
      - 'agi_core/**'
      - 'mcp/**'
      - 'notebooks/**'
      - 'scripts/notebooks/**'
      - 'application/routes/cli_bp_routes.py'
      - 'application/routes/web_action_bp_routes.py'
      - 'application/mission_api.py'
      - 'application/cli_artifacts.py'
      - 'application/engineering_*.py'
      - 'application/engineering_viewer.html'
      - 'application/engineering_viewer_assets/**'
      - 'aurora_agi_daemon.py'
      - 'scripts/publish-live-link.sh'
      - 'scripts/aurora-status-watcher.sh'
      - 'scripts/verify-tunnel-url.sh'
      - 'tests_agi/**'
      - 'tests_auto_rl/**'
      - 'auto_rl/**'
      - '.github/workflows/mission-contracts.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: AuroraIA
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: juancodepyandc/aurora-remote-cli
          ref: main
          path: aurora-remote-cli
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -e "aurora-remote-cli[test]" aiohttp flask requests manifold3d pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests_agi tests_auto_rl -q --durations=20 -o faulthandler_timeout=120
        working-directory: AuroraIA
