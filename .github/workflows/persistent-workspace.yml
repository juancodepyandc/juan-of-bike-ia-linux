name: Persistent workspace contracts
on:
  push:
    branches: [main]
    paths:
      - 'application/persistent_workspace*'
      - 'application/device_*'
      - 'application/scripts/*persistent-workspace.mjs'
      - 'application/package*.json'
      - 'application/src/utils/bridgeAuth.ts'
      - 'application/scripts/test-bridge-auth.mjs'
      - 'application/src/hooks/useTauri.ts'
      - 'application/src/views/ModelView.tsx'
      - 'application/src/components/ProjectsPanel.tsx'
      - 'application/src/stores/moduleHistoryStore.ts'
      - 'application/scripts/test-history-cleanup.mjs'
      - 'application/scripts/test-python-result.mjs'
      - 'application/scripts/test-material-channels.mjs'
      - 'application/scripts/test-model-delivery-recovery.mjs'
      - 'application/src/utils/recoverModelDelivery.ts'
      - 'application/src/utils/pythonResult.ts'
      - 'application/src/utils/materialChannels.ts'
      - 'application/src/services/referenceVisualResearch.ts'
      - 'application/src/services/taskIntelligence.ts'
      - 'application/src/services/threeDIntent.ts'
      - 'application/src/utils/fluxWorkflow.ts'
      - 'application/src/utils/binaryBase64.ts'
      - 'application/src/utils/threeDConversationContext.ts'
      - 'application/src/services/compoundScene.ts'
      - 'application/scripts/test-fidelity-inspection.mjs'
      - 'application/scripts/test-flux-reference-conditioning.mjs'
      - 'application/scripts/test-generation-cancel.mjs'
      - 'application/src/utils/uiSkin.ts'
      - 'application/src/utils/buildRecovery.ts'
      - 'application/scripts/test-interface-stability.mjs'
      - 'application/src/stores/forgeQueueStore.ts'
      - 'application/src/utils/projectAdmission.ts'
      - 'application/src/hooks/useManagedRuntime.ts'
      - 'application/src/components/generationFx/GenerationFxHost.tsx'
      - 'application/scripts/test-project-admission-cancel.mjs'
      - 'application/scripts/test-forge-admission.mjs'
      - 'application/project_viewer.html'
      - 'application/projects_api.py'
      - 'application/scripts/test-project-viewer.mjs'
      - 'tests_agi/project_viewer_fixture.py'
      - 'tests_agi/engineering_viewer_fixture.py'
      - 'application/engineering_viewer.html'
      - 'application/engineering_insertion.py'
      - 'application/engineering_design_api.py'
      - 'application/scripts/test-engineering-insertion-viewer.mjs'
      - '.github/workflows/persistent-workspace.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install flask numpy trimesh scipy manifold3d
      - run: npx playwright install --with-deps chromium
      - run: npm run test:workspace
      - run: node scripts/test-interface-stability.mjs
      - run: node scripts/test-bridge-auth.mjs
      - run: node scripts/test-generation-cancel.mjs
      - run: node scripts/test-fidelity-inspection.mjs
      - run: node scripts/test-history-cleanup.mjs
      - run: node scripts/test-python-result.mjs
      - run: node scripts/test-material-channels.mjs
      - run: node scripts/test-model-delivery-recovery.mjs
      - run: node scripts/test-flux-reference-conditioning.mjs
      - run: node scripts/test-project-admission-cancel.mjs
      - run: node scripts/test-forge-admission.mjs
      - run: node scripts/test-project-viewer.mjs
      - run: node scripts/test-engineering-insertion-viewer.mjs
