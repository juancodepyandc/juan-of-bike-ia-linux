[package]
name = "juan-of-bike-ia"
version = "2.0.0"
description = "juan of bike IA - copilote IA local et precis"
authors = ["Juan"]
edition = "2021"

[lib]
name = "juan_of_bike_ia_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
num_cpus = "1.16"
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = "s"
strip = true

[profile.dev]
debug = 0
incremental = false
codegen-units = 64
