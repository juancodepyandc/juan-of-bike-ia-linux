<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appareils · Aurora</title><style>*{box-sizing:border-box}body{margin:0;background:#080d19;color:#e6eaf5;font:16px system-ui}main{max-width:760px;padding:24px;margin:auto}p{line-height:1.6;color:#b1bdd3}.card{padding:18px;margin-top:16px;background:#141b2f;border:1px solid #536080;border-radius:16px}button{font:inherit;min-height:48px;padding:12px 18px;border:0;border-radius:12px;background:#8b5cf6;color:white;cursor:pointer;margin-top:12px}.code{font-size:30px;letter-spacing:6px}a{color:#cfbfff}#status{color:#fda4af}</style></head><body><main><a href="/">← Aurora</a><h1>Vos appareils</h1><p>Sur le téléphone, ouvrez Aurora et choisissez « Connecter mon appareil ». Validez ici uniquement le code qui apparaît sur votre téléphone. Aucune clé à chercher ou à envoyer.</p><h2>Demandes de connexion</h2><div id="pending"></div><h2>Appareils autorisés</h2><div id="devices"></div><p id="status" role="status"></p></main><script type="module">
const $=id=>document.getElementById(id);let signature='',busy=false;
async function api(data){const r=await fetch('/api/devices/manage',{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Action refusée.');return d}
async function action(data){busy=true;try{await api(data);signature='';await render()}catch(e){$('status').textContent=e.message}finally{busy=false}}
function card(name,text,label,onClick){const div=document.createElement('div');div.className='card';const title=document.createElement('strong');title.textContent=name;const p=document.createElement('p');p.textContent=text;div.append(title,p);if(label){const b=document.createElement('button');b.textContent=label;b.onclick=onClick;div.append(b)}return div}
async function render(){try{const data=await api();const sig=JSON.stringify(data);if(sig===signature)return;signature=sig;$('pending').replaceChildren(...(data.pending.length?data.pending.map(p=>{const div=card(p.name,p.approved?'Validation envoyée, le téléphone va se connecter.':'Demande valable cinq minutes.',p.approved?'Validé':'Autoriser cet appareil',()=>action({action:'approve',code:p.code}));const code=document.createElement('div');code.className='code';code.textContent=p.code;div.prepend(code);return div}):[card('Aucune demande','Les demandes du téléphone apparaîtront ici.')]));$('devices').replaceChildren(...data.devices.map(d=>card(d.name,d.revoked?'Accès retiré':'Connecté · autorisation mémorisée',d.revoked?null:'Retirer l’accès',()=>action({action:'revoke',id:d.id}))))}catch(e){$('status').textContent=e.message}}
void render();setInterval(()=>{if(!document.hidden&&!busy)void render()},2000);
</script></body></html>
