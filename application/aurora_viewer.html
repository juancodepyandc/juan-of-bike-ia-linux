<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aurora Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1f24; color: #dfe3e8; font-family: sans-serif; }
  #canvas { position: fixed; inset: 0; }
  #panel { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; overflow-y: auto;
           background: rgba(18,20,24,.92); padding: 10px; z-index: 2; }
  #panel h3 { margin: 6px 0; font-size: 13px; color: #9ad; }
  #panel a { display: block; color: #cde; text-decoration: none; font-size: 12px;
             padding: 3px 6px; border-radius: 4px; word-break: break-all; }
  #panel a:hover { background: #2a3140; }
  #panel a.actif { background: #2f6; color: #123; }
  #hud { position: fixed; right: 10px; top: 10px; z-index: 2; background: rgba(18,20,24,.85);
         padding: 8px 12px; border-radius: 6px; font-size: 12px; max-width: 380px; }
  #togglePanel { position: fixed; left: 290px; top: 10px; z-index: 3; }
</style>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel"><h3>Générations</h3><div id="liste">chargement…</div></div>
<button id="togglePanel">⇔</button>
<div id="hud">Choisis un GLB à gauche (ou glisse un fichier). Animations en lecture automatique.</div>
<div id="canvas"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvas').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x23272e);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.001, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
const clock = new THREE.Clock();
let mixer = null, racine = null;

const hud = document.getElementById('hud');
const loader = new GLTFLoader();

function cadre(objet) {
  const boite = new THREE.Box3().setFromObject(objet);
  const taille = boite.getSize(new THREE.Vector3()).length();
  const centre = boite.getCenter(new THREE.Vector3());
  camera.near = taille / 1000; camera.far = taille * 20;
  camera.position.copy(centre).add(new THREE.Vector3(taille * .55, taille * .3, taille * .55));
  camera.updateProjectionMatrix();
  controls.target.copy(centre); controls.update();
}

function charge(url, nom) {
  hud.textContent = 'chargement de ' + nom + ' …';
  loader.load(url, g => {
    if (racine) { scene.remove(racine); racine.traverse(o => { o.geometry?.dispose(); }); }
    racine = g.scene; scene.add(racine); cadre(racine);
    mixer = null;
    if (g.animations.length) {
      mixer = new THREE.AnimationMixer(racine);
      g.animations.forEach(clip => mixer.clipAction(clip).setLoop(THREE.LoopRepeat).play());
    }
    hud.textContent = nom + ' — ' + g.animations.length + ' animation(s)' +
      (g.animations.length ? ' (lecture en boucle)' : '');
  }, p => {
    if (p.total) hud.textContent = nom + ' … ' + Math.round(100 * p.loaded / p.total) + '%';
  }, e => { hud.textContent = 'ERREUR: ' + (e.message || e); });
}

async function lienDossier(url) {
  const r = await fetch(url); const t = await r.text();
  const doc = new DOMParser().parseFromString(t, 'text/html');
  return [...doc.querySelectorAll('a')].map(a => a.getAttribute('href')).filter(h => h && h !== '../');
}

async function listeGlb() {
  const conteneur = document.getElementById('liste');
  conteneur.textContent = '';
  try {
    const base = '/output/3d/generations/';
    for (const d of (await lienDossier(base)).filter(h => h.endsWith('/'))) {
      const fichiers = (await lienDossier(base + d)).filter(h => h.toLowerCase().endsWith('.glb'));
      if (!fichiers.length) continue;
      const h = document.createElement('h3'); h.textContent = decodeURIComponent(d.replace('/', ''));
      conteneur.appendChild(h);
      for (const f of fichiers) {
        const a = document.createElement('a');
        a.textContent = decodeURIComponent(f);
        a.href = '#';
        a.onclick = ev => { ev.preventDefault();
          [...conteneur.querySelectorAll('a')].forEach(x => x.classList.remove('actif'));
          a.classList.add('actif');
          charge(base + d + f, decodeURIComponent(f)); };
        conteneur.appendChild(a);
      }
    }
  } catch (e) { conteneur.textContent = 'listing indisponible: ' + e; }
}

addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) charge(URL.createObjectURL(f), f.name);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.getElementById('togglePanel').onclick = () => {
  const p = document.getElementById('panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
};

const param = new URLSearchParams(location.search).get('file');
if (param) charge('/' + param.replace(/^\//, ''), param.split('/').pop());
listeGlb();

renderer.setAnimationLoop(() => {
  if (mixer) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
