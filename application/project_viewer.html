<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aurora · Objet 3D</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101525;color:#e6eaf5;font:14px system-ui}main{height:100dvh;display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:8px;padding:12px}button,select{font:inherit;min-height:44px;padding:8px;border:1px solid #6a5990;border-radius:10px;background:#22243a;color:inherit}#stage{flex:1;min-height:0;position:relative}canvas{display:block;touch-action:none}#status{position:absolute;top:8px;left:12px;right:12px;background:#101525dd;padding:8px;pointer-events:none}footer{padding:8px 12px max(8px,env(safe-area-inset-bottom));color:#adb4cb}</style>
<script type="importmap">{"imports":{"three":"./viewer_assets/build/three.module.js","three/addons/":"./viewer_assets/addons/"}}</script></head>
<body><main><header><select id="meshes" aria-label="Fichier 3D"></select><button id="prepare">Préparer l’assemblage / impression</button><button id="frame">Tout cadrer</button><select id="appearance" aria-label="Aspect"><option value="textured">Textures originales</option><option value="pure">Géométrie pure</option></select></header><section id="stage"><p id="status" role="status">Chargement du résultat…</p></section><footer>Tourner : glisser · zoomer : pincer ou molette. Vue du modèle original ; les pièces imprimables doivent être préparées et vérifiées séparément.</footer></main>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),stage=$('stage'),status=$('status');let object,originals=[],epoch=0,projectTitle="",projectStatus='';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x101525);renderer.toneMapping=THREE.ACESFilmicToneMapping;stage.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.001,10000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x56617d,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,4,5);scene.add(light);
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);
function frame(){if(!object)return;const box=new THREE.Box3().setFromObject(object),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length();if(!Number.isFinite(size)||!size)throw Error('Géométrie vide ou non finie.');controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size*.7,size*.45,size*.9));camera.near=size/10000;camera.far=size*100;camera.updateProjectionMatrix();controls.update()}
function appearance(){for(const [node,material] of originals)node.material=$('appearance').value==='pure'?node.userData.pureMaterial:material;}
async function load(){const sequence=++epoch;status.textContent='Chargement du fichier 3D…';try{const url=new URL($('meshes').value,location.origin);const prefix=location.pathname.replace(/\/viewer\/.*$/,'/files/');const manager=new THREE.LoadingManager();manager.setURLModifier(value=>{if(value.startsWith('data:')||value.startsWith('blob:'))return value;const asset=new URL(value,url);if(asset.origin!==location.origin||!asset.pathname.startsWith(prefix))throw Error('Ressource externe non autorisée.');return asset.href});const gltf=await new GLTFLoader(manager).loadAsync(url.href);if(sequence!==epoch)return;if(object){scene.remove(object);for(const [node,material] of originals){node.geometry.dispose();node.userData.pureMaterial.dispose();for(const m of Array.isArray(material)?material:[material])m.dispose()}}object=gltf.scene;originals=[];object.traverse(node=>{if(node.isMesh){originals.push([node,node.material]);node.userData.pureMaterial=new THREE.MeshStandardMaterial({color:0xc6cbdb,roughness:.65})}});scene.add(object);appearance();frame();status.textContent=projectStatus==='completed'?'Modèle chargé · inspection libre autour de l’objet.':'Aperçu enregistré · projet '+projectStatus+' · livraison non validée.';document.body.dataset.ready='true'}catch(error){status.textContent=error.message;document.body.dataset.ready='false'}}
$('prepare').onclick=()=>{try{const match=location.pathname.match(/\/api\/projects\/(mis_[a-f0-9]{16})\/viewer\//);if(!match)throw Error('Projet source introuvable.');const selected=new URL($('meshes').value,location.origin),prefix='/api/projects/'+match[1]+'/files/';if(!selected.pathname.startsWith(prefix))throw Error('Modèle source invalide.');localStorage.setItem('aurora.engineering-objective.v1.source',JSON.stringify({mission_id:match[1],file:decodeURIComponent(selected.pathname.slice(prefix.length))}));localStorage.setItem('aurora.engineering-objective.v1',JSON.stringify({goal:'Préparer le modèle source pour l’impression et son assemblage, en préservant sa silhouette et ses couleurs. Concevoir des pièces par couleur si le profil ne permet pas plusieurs filaments, des interfaces aussi discrètes que possible, et tester les jeux, épaisseurs et trajets de montage. Contexte : '+projectTitle,constraints:''}));localStorage.setItem('aurora.3d.workspace','assembly');const previous=JSON.parse(localStorage.getItem('juan-bike-app-store')||'{"state":{},"version":9}');previous.state={...previous.state,activeModule:'3d'};localStorage.setItem('juan-bike-app-store',JSON.stringify(previous));location.assign('/')}catch(error){status.textContent=error.message}};
$('frame').onclick=frame;$('appearance').onchange=appearance;$('meshes').onchange=load;renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
try{const r=await fetch('./meshes.json');if(!r.ok)throw Error('Projet indisponible.');const d=await r.json();projectTitle=d.title||'';projectStatus=d.status;for(const mesh of d.meshes){const option=new Option(mesh.name,mesh.url);$('meshes').append(option)}if(!d.meshes.length)throw Error('Aucun résultat GLB enregistré pour le moment.');await load()}catch(error){status.textContent=error.message}
</script></body></html>
