<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#141414;overflow:hidden}#c{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/application/node_modules/three/build/three.module.js",
  "three/addons/": "/application/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" width="1000" height="1000"></canvas>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

const params = new URLSearchParams(location.search)
const GLB = params.get('glb')
const AZ = parseFloat(params.get('az') || '35')   // azimuth deg
const EL = parseFloat(params.get('el') || '12')   // elevation deg
const BG = params.get('bg') || '#141414'

const canvas = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true })
renderer.setSize(1000, 1000, false)
// MATCH the real ModelView viewer: ACES tone mapping + sRGB + studio IBL.
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.0
const scene = new THREE.Scene()
scene.background = new THREE.Color(BG)
// Image-based lighting from RoomEnvironment (the viewer's offline default) —
// this is what produces the reflections/highlights the USER actually sees.
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
// gentle key + fill so shape reads even on matte surfaces
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 5, 4); scene.add(key)
scene.add(new THREE.AmbientLight(0xffffff, 0.25))
const cam = new THREE.PerspectiveCamera(38, 1, 0.01, 1000)

// ---- aurora_flow water shader (same as ModelView) so water reads as flowing ----
const flowBindings = []
function collectFlow(root) {
  root.traverse((child) => {
    if (!child.isMesh) return
    const mats = Array.isArray(child.material) ? child.material : [child.material]
    mats.forEach((mat) => {
      if (!mat) return
      const ud = mat.userData || {}
      const ex = ud.gltfExtras || ud.extras || null
      const c = (ex && ex.aurora_flow) || ud.aurora_flow
      if (!c || !mat.map) return
      const dir = Array.isArray(c.direction) ? c.direction : [0, -1]
      const len = Math.hypot(dir[0], dir[1]) || 1
      const u = { uAuroraFlowTime: { value: 0 }, uAuroraFlowDir: { value: [dir[0]/len, dir[1]/len] },
                  uAuroraFlowSpeed: { value: Math.max(0.02, Math.min(1.5, Number(c.vitesse||1) * 0.2)) },
                  uAuroraFlowAmp: { value: 0.12 } }
      mat.onBeforeCompile = (sh) => {
        sh.uniforms.uAuroraFlowTime = u.uAuroraFlowTime; sh.uniforms.uAuroraFlowDir = u.uAuroraFlowDir
        sh.uniforms.uAuroraFlowSpeed = u.uAuroraFlowSpeed; sh.uniforms.uAuroraFlowAmp = u.uAuroraFlowAmp
        sh.fragmentShader = sh.fragmentShader
          .replace('#include <common>', 'uniform float uAuroraFlowTime;uniform vec2 uAuroraFlowDir;uniform float uAuroraFlowSpeed;uniform float uAuroraFlowAmp;\n#include <common>')
          .replace('#include <map_fragment>', ['#ifdef USE_MAP','vec4 _b=texture2D(map,vMapUv);','float _mx=max(max(_b.r,_b.g),_b.b),_mn=min(min(_b.r,_b.g),_b.b);','float _s=_mx>0.001?(_mx-_mn)/_mx:0.0;','float _m=smoothstep(0.28,0.52,_s);','float _cy=fract(uAuroraFlowTime*uAuroraFlowSpeed);','vec2 _u0=vMapUv+uAuroraFlowDir*(_cy-0.5)*uAuroraFlowAmp*_m;','vec2 _u1=vMapUv+uAuroraFlowDir*(fract(_cy+0.5)-0.5)*uAuroraFlowAmp*_m;','vec4 _f=mix(texture2D(map,_u0),texture2D(map,_u1),abs(_cy*2.0-1.0));','vec4 sampledDiffuseColor=mix(_b,_f,_m);','diffuseColor*=sampledDiffuseColor;','#endif'].join('\n'))
      }
      mat.needsUpdate = true; flowBindings.push({ u })
    })
  })
}

const draco = new DRACOLoader(); draco.setDecoderPath('/application/node_modules/three/examples/jsm/libs/draco/')
const loader = new GLTFLoader(); loader.setDRACOLoader(draco)
window.__status = 'loading'
let mixer = null
loader.load(GLB, (gltf) => {
  const root = gltf.scene; scene.add(root)
  const box = new THREE.Box3().setFromObject(root)
  const ctr = box.getCenter(new THREE.Vector3()); const size = box.getSize(new THREE.Vector3())
  const rad = Math.max(size.x, size.y, size.z) * 0.5 || 1
  const az = AZ * Math.PI/180, el = EL * Math.PI/180
  const D = rad*4.6
  cam.position.set(ctr.x + Math.sin(az)*Math.cos(el)*D, ctr.y + Math.sin(el)*D + size.y*0.05, ctr.z + Math.cos(az)*Math.cos(el)*D)
  cam.lookAt(ctr)
  collectFlow(root)
  // roughness override test: ?rough=0.85 forces every material matte (nulls the
  // roughness map + sets a high roughness) to check the "wet plastic" hypothesis.
  const roughOv = params.get('rough')
  if (roughOv !== null) {
    const rv = parseFloat(roughOv)
    root.traverse((c) => { if (!c.isMesh) return; const ms = Array.isArray(c.material) ? c.material : [c.material]; ms.forEach((m) => { if (!m) return; m.roughnessMap = null; m.roughness = rv; m.metalness = 0; m.needsUpdate = true }) })
  }
  if (gltf.animations && gltf.animations.length) { mixer = new THREE.AnimationMixer(root); gltf.animations.forEach(a => mixer.clipAction(a).play()) }
  renderer.compile(scene, cam); renderer.render(scene, cam)
  window.__glError = renderer.getContext().getError(); window.__status = 'ready'
}, undefined, (e) => { window.__status = 'error:' + (e && e.message || e) })

window.__renderAt = (t) => {
  if (mixer) { mixer.setTime(t) }
  for (const b of flowBindings) b.u.uAuroraFlowTime.value = t
  renderer.render(scene, cam); return true
}
</script>
</body>
</html>
